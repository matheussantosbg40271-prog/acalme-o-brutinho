let save=loadSave();function loadSave(){try{const a=JSON.parse(readStored()||'null');if(!a)return defaultSave();const d=defaultSave();return {...d,...a,settings:{...d.settings,...(a.settings||{})},scores:a.scores||{},owned:Array.from(new Set(['bravo',...(a.owned||[])]))}}catch(e){return defaultSave()}}

function levelForXP(xp){return Math.floor(Math.sqrt(Math.max(0,xp)/90))+1}
function currentLevelInfo(){const l=save.level;const cur=(l-1)*(l-1)*90;const next=l*l*90;return {cur:Math.max(0,save.xp-cur),need:Math.max(1,next-cur),pct:Math.min(100,Math.max(0,(save.xp-cur)/(next-cur)*100))}}
function applyProgress(amount,coins=0){const oldLevel=save.level;save.xp+=amount;save.coins+=coins;save.level=levelForXP(save.xp);let unlocked=[];if(save.level>=2&&!save.owned.includes('debochado')){save.owned.push('debochado');unlocked.push('Brutinho Debochado')}if(save.level>=3&&!save.owned.includes('susto')){save.owned.push('susto');unlocked.push('Brutinho Assustado')}if(save.level>=5&&!save.owned.includes('correndo')){save.owned.push('correndo');unlocked.push('Brutinho na Correria')}if(save.level>=8&&!save.owned.includes('opalão')){save.owned.push('opalão');unlocked.push('Opala Clássico')}if(save.level>=10&&!save.owned.includes('legendary')){save.owned.push('legendary');unlocked.push('Brutinho Bravo — Lendária')}persist();return {oldLevel,newLevel:save.level,unlocked}}

function renderMenu(){return `<div class="screen"><section class="panel menu-hero"><div class="menu-copy"><div class="eyebrow">A aventura mais estressada da tela</div><h1>ACALME O<br><span>BRUTINHO!</span></h1><p class="lead">Uma aventura de humor, reflexo e coleção. Ajude o Brutinho a encarar situações absurdas e descubra todas as figurinhas.</p><div class="menu-badges"><span class="pill">v0.1.0 BETA</span><span class="pill">Projeto de fã</span><span class="pill">Seu progresso salvo</span></div><div class="btn-row"><button class="btn primary" data-action="playAdventure">${icon('play')} JOGAR</button><button class="btn outline" data-nav="minigames">${icon('game')} MINIJOGOS</button></div></div><div class="hero-art"><img class="hero-person" src="${ASSETS.bravo}" alt="Brutinho com os braços cruzados"><div class="hero-caption">TÁ VENDO O QUÊ?</div></div></section><div class="quick-grid"><button class="quick-card" data-nav="adventure"><span class="quick-icon">${icon('map')}</span><span><strong>Aventura</strong><small>Explore os desafios</small></span></button><button class="quick-card" data-nav="album"><span class="quick-icon">${icon('cards')}</span><span><strong>Figurinhas</strong><small>${save.owned.length} de ${cardDefs.length} cartas</small></span></button><button class="quick-card" data-nav="store"><span class="quick-icon">${icon('coin')}</span><span><strong>Loja de cartas</strong><small>Pacotinhos por moedas</small></span></button><button class="quick-card" data-nav="profile"><span class="quick-icon">${icon('user')}</span><span><strong>Meu perfil</strong><small>${esc(save.nick)} · nível ${save.level}</small></span></button></div><div class="feature-row"><section class="panel feature"><div class="ic-wrap">${icon('game','ic')}</div><h3>Minijogos controláveis</h3><p>Desvie, pule, pegue itens e encontre o caminho. Cada jogo usa controles próprios.</p></section><section class="panel feature"><div class="ic-wrap">${icon('cards','ic')}</div><h3>Uma coleção para completar queada!':'Vença qualquer minijogo para desbloquear.'}</p></div></div><div class="changelog"><div class="version-dot">${icon('cards')}</div><div><strong>Caçador de figurinhas</strong><p>${save.owned.length>=5?'Conquista desbloqueada!':`Colete 5 cartas (${save.owned.length}/5).`}</p></div></div></section></div><div class="section-head"><div><div class="eyebrow">Personalização</div><h2>Foto de perfil</h2></div><span class="small muted">Toque para equipar</span></div><div class="grid four">${poses.map(id=>{const owned=save.owned.includes(id);const def=cardDefs.find(c=>c.id===id);return `<button class="avatar-choice ${save.avatar===id?'selected':''} ${owned?'':'locked'}" data-avatar="${id}" ${owned?'':'disabled'}><img src="${ASSETS[id]}" alt="${def.name}"><span>${def.name.replace('Brutinho ','')}</span>${!owned?`<small class="muted">${icon('lock')}</small>`:''}</button>`}).join('')}</div><div class="section-head"><div><div class="eyebrow">Sua coleção</div><h2>Cartas favoritas</h2></div><button class="btn small-btn outline" data-nav="album">Ver álbum ${icon('right')}</button></div><div class="sticker-grid">${cardDefs.filter(c=>save.owned.includes(c.id)).slice(0,4).map(c=>`<button class="sticker owned ${c.rarity}" data-card="${c.id}"><div class="sticker-art">${cardArt(c)}${c.rarity==='legendary'?'<div class="sticker-foil"></div>':''}</div><div class="sticker-detail"><strong>${c.name}</strong><span class="rarity ${c.rarity}">${rarityLabel(c.rarity)}</span></div></button>`).join('')}</div></div>`}
function renderStore(){return `<div class="screen"><div class="page-head"><div><div class="eyebrow">Troque moedas por surpresas</div><h1>Loja de cartas</h1><p class="lead">Abra pacotinhos para encontrar figurinhas. As cartas lendárias são muito mais raras.</p></div><button class="btn outline back-btn" data-nav="menu">${icon('back')} Menu</button></div><div class="grid two"><section class="panel panel-pad"><div style="display:flex;justify-content:center;align-items:center;min-height:190px;background:radial-gradient(ellipse at center,#5a4220,#25202f 70%);border-radius:15px;margin-bottom:15px;overflow:hidden"><div style="width:130px;height:166px;border:2px solid #f6d77e;border-radius:12px;background:linear-gradient(145deg,#5e4724,#261f35);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;transform:rotate(-5deg);box-shadow:10px 13px 28px #0007"><div style="font-size:10px;letter-spacing:2px;color:#ffe59f;font-weight:1000">PACOTINHO</div>${icon('cards','ic')}<div style="font-size:20px;font-weight:1000;text-align:center;line-height:1;color:#fff0bd">SURPRESA<br>DO BRUTINHO</div><div style="color:#ffe59f;font-size:9px">COLECIONÁVEIS</div></div></div><h2>Pacotinho surpresa</h2><p class="muted small">Receba uma carta que ainda não está na sua coleção, quando houver uma disponível.</p><div class="btn-row"><button class="btn primary block" data-action="openPack" ${save.coins<80?'disabled':''}>${icon('coin')} Abrir por 80 moedas</button></div><p class="tiny muted" style="margin:10px 0 0">Saldo atual: ${save.coins} moedas. Não há compras com dinheiro real.</p></section><section class="panel panel-pad"><div class="eyebrow">Como funciona</div><h2 style="margin-top:8px">Raridades</h2>${[['common','Comum','Aparece com mais frequência.'],['uncommon','Incomum','Uma surpresa um pouco mais especial.'],['rare','Rara','Chance menor de encontrar.'],['epic','Épica','Carta muito difícil de conseguir.'],['legendary','Lendária','A carta dourada é a mais rara.']].map(r=>`<div class="changelog"><div class="version-dot" style="${r[0]==='legendary'?'border-color:#d6a83e;color:#ffe18a;background:#463719':''}">${icon('star')}</div><div><strong class="rarity ${r[0]}">${r[1]}</strong><p>${r[2]}</p></div></div>`).join('')}</section></div></div>`}
function renderSettings(){return `<div class="screen"><div class="page-head"><div><div class="eyebrow">Ajuste ao seu gosto</div><h1>Configurações</h1><p class="lead">As preferências ficam salvas neste navegador.</p></div><button class="btn outline back-btn" data-nav="menu">${icon('back')} Menu</button></div><section class="panel panel-pad"><div class="setting-row"><div><strong>Música de fundo</strong><p>Trilha original sintetizada no próprio jogo.</p></div><button class="toggle ${save.settings.music?'on':''}" data-toggle="music" aria-label="Alternar música"><span></span></button></div><div class="setting-row"><div><strong>Efeitos sonoros</strong><p>Moedas, botões, acertos e resultados.</p></div><button class="toggle ${save.settings.sfx?'on':''}" data-toggle="sfx" aria-label="Alternar efeitos sonoros"><span></span></button></div><div class="setting-row" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>Volume geral</strong><p>Controle o volume da trilha e dos efeitos.</p></div><strong id="volumeLabel">${Math.round(save.settings.volume*100)}%</strong></div><input class="range" type="range" min="0" max="100" step="5" value="${Math.round(save.settings.volume*100)}" data-volume style="margin-top:15px"></div></section><div class="section-head"><div><div class="eyebrow">Informações</div><h2>Sobre o jogo</h2></div></div><div class="grid two"><button class="panel quick-card" data-nav="about"><span class="quick-icon">${icon('info')}</span><span><strong>Sobre e créditos</strong><small>Versão, IA e avisos</small></span></button><button class="panel quick-card" data-nav="updates"><span class="quick-icon">${icon('book')}</span><span><strong>Histórico de versões</strong><small>Novidades e correções</small></span></button></div><div class="section-head"><h2>Dados locais</h2></div><section class="panel panel-pad"><p class="muted small">Seu nick, moedas, nível, cartas e configurações são guardados no armazenamento deste navegador. Limpar os dados do navegador pode apagar o progresso.</p><button class="btn danger" data-action="resetSave">${icon('refresh')} Reiniciar progresso</button></section></div>`}
function renderAbout(){return `<div class="screen"><div class="page-head"><div><div class="eyebrow">Informações oficiais do projeto</div><h1>Sobre o jogo</h1><p class="lead">Conheça a versão instalada, os créditos e como este projeto foi desenvolvido.</p></div><button class="btn outline back-btn" data-nav="settings">${icon('back')} Voltar</button></div><section class="panel panel-pad" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:15px"><div class="brand-mark" style="width:56px;height:56px">${icon('crown','ic')}</div><div><h2 style="margin-bottom:4px">Acalme o Brutinho!</h2><div class="muted small">Jogo de aventura e minijogos · Projeto de fã</div></div></div><div class="about-grid" style="margin-top:20px"><div class="about-item"><span>Versão instalada</span><strong>v${VERSION} BETA</strong></div><div class="about-item"><span>Status</span><strong class="release-date">Em fase de testes</strong></div><div class="about-item"><span>Build de testes</span><strong>${BUILD_DATE}</strong></div><div class="about-item"><span>Lançamento oficial</span><strong>A anunciar</strong></div><div class="about-item"><span>Criador do projeto</span><strong>@brutinctss</strong></div><div class="about-item"><span>Canal de referência</span><strong>Super Comédia</strong></div></div></section><section class="panel panel-pad" style="margin-bottom:14px"><h2>Desenvolvimento com auxílio de IA</h2><p class="muted" style="font-size:13px;line-height:1.65">Este jogo foi idealizado e dirigido por <strong style="color:var(--text)">@brutinctss</strong>, com auxílio de ferramentas de inteligência artificial para apoiar a criação de ideias, código e recursos visuais. O projeto é experimental e pode conter erros; as mecânicas e os conteúdos continuam em desenvolvimento.</p></section><section class="panel panel-pad" style="margin-bottom:14px"><h2>Créditos e natureza do projeto</h2><p class="muted" style="font-size:13px;line-height:1.65">Criado por <strong style="color:var(--text)">@brutinctss</strong>. Inspirado no universo do canal <strong style="color:var(--text)">Super Comédia</strong>. Esta é uma criação independente de fã, não oficial e sem vínculo ou aprovação do canal, salvo autorização expressa. Nomes e referências a integrantes são usados como referência de fã; retratos personalizados devem ser adicionados com materiais apropriados.</p></section><section class="panel panel-pad"><h2>Privacidade</h2><p class="muted" style="font-size:13px;line-height:1.65">Nesta versão, o jogo não solicita cadastro, e-mail ou localização. Nick, progresso, moedas, cartas e configurações ficam armazenados localmente no navegador deste aparelho. O arquivo não envia esses dados a um servidor. Se o armazenamento do navegador for limpo, o progresso local poderá ser perdido. Não existe ranking online nesta versão.</p><button class="btn outline" data-nav="updates">${icon('book')} Ver histórico de versões</button></section></div>`}
function renderUpdates(){return `<div class="screen"><div class="page-head"><div><div class="eyebrow">Notas de atualização</div><h1>Histórico de versões</h1><p class="lead">Cada versão registra o que mudou de verdade no jogo.</p></div><button class="btn outline back-btn" data-nav="settings">${icon('back')} Voltar</button></div><section class="panel panel-pad"><div class="changelog"><div class="version-dot">${icon('spark')}</div><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong>v${VERSION} BETA</strong><span class="tag gold">Versão de testes</span></div><p><strong>${BUILD_DATE}</strong><br>Identidade nova “Acalme o Brutinho!”, menu reorganizado, perfil com avatar por figurinha, música e efeitos controláveis, tela de carregamento, área “Sobre”, créditos transparentes, progressão com XP, cartas colecionáveis e quatro minijogos controláveis.</p></div></div><div class="callout" style="margin-top:15px"><strong>Em desenvolvimento</strong><p>Mais animações, artes específicas de integrantes, novas fases, refinamento de controles e balanceamento das recompensas podem chegar em versões futuras. Não há uma data de atualização confirmada.</p></div></section></div>`}
function showModal(html){$('#modalHost').innerHTML=`<div class="modal-backdrop" data-dismiss-modal><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function hideModal(){$('#modalHost').innerHTML=''}
function showNickModal(){nickReturnScreen=currentScreen;showModal(`<div class="modal-head"><div><div class="eyebrow">Perfil de jogador</div><h2>Qual é seu nick?</h2></div><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div><p class="muted small">O nome aparecerá no seu perfil. Você pode mudar depois.</p><label class="label" for="nickInput">Seu nome no jogo</label><input id="nickInput" class="input" maxlength="18" placeholder="Digite seu nick" value="${esc(save.nick==='Jogador'?'':save.nick)}" autocomplete="nickname"><div class="btn-row" style="margin-top:15px"><button class="btn primary block" data-action="saveNick">Salvar nick</button><button class="btn outline" data-action="closeModal">Agora não</button></div>`);setTimeout(()=>$('#nickInput')?.focus(),50)}
function showCardModal(id){const c=cardDefs.find(c=>c.id===id);if(!c)return;const own=save.owned.includes(id);showModal(`<div class="modal-head"><div><div class="eyebrow">Carta colecionável</div><h2>${esc(c.name)}</h2><span class="rarity ${c.rarity}">${rarityLabel(c.rarity)}</span></div><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div><div class="modal-art">${cardArt(c)}</div><p class="muted" style="font-size:13px;line-height:1.55">${esc(c.desc)}</p><div class="callout"><strong>${own?'Carta desbloqueada':'Como desbloquear'}</strong><p>${own?'Ela já faz parte do seu álbum.':esc(c.unlock)}</p></div><div class="btn-row" style="margin-top:14px">${own&&c.kind==='char'?`<button class="btn primary block" data-action="equipCard" data-id="${c.id}">${icon('user')} Usar como avatar</button>`:''}<button class="btn outline" data-action="closeModal">Fechar</button></div>`)}
function showPackResult(card,dup){showModal(`<div class="modal-head"><div><div class="eyebrow">Pacotinho aberto</div><h2>${dup?'Você encontrou uma repetida!':'Nova figurinha!'}</h2></div><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div><div class="modal-art ${card.rarity==='legendary'?'unlock-flash':''}">${cardArt(card)}</div><div style="text-align:center"><span class="rarity ${card.rarity}">${rarityLabel(card.rarity)}</span><h2 style="margin:8px 0">${esc(card.name)}</h2><p class="muted small">${dup?'A carta repetida virou 25 moedas.':'A carta foi adicionada à sua coleção!'}</p></div><div class="btn-row"><button class="btn primary block" data-action="closeModal">Continuar</button><button class="btn outline" data-nav="album" data-action="closeThenAlbum">Ver álbum</button></div>`)}
function openPack(){if(save.coins<80){toast('Você precisa de 80 moedas para abrir um pacotinho.');return}save.coins-=80;const pool=cardDefs.filter(c=>!save.owned.includes(c.id));if(!pool.length){save.coins+=40;persist();toast('Você já completou o álbum! Recebeu 40 moedas.');setScreen(currentScreen);return}const roll=Math.random();let rarity=roll<.54?'common':roll<.78?'uncommon':roll<.92?'rare':roll<.99?'epic':'legendary';let options=pool.filter(c=>c.rarity===rarity);if(!options.length)options=pool;const card=options[Math.floor(Math.random()*options.length)];const dup=save.owned.includes(card.id);if(dup)save.coins+=25;else save.owned.push(card.id);const prog=applyProgress(8,0);persist();renderNav();$('#topCoins').textContent=save.coins;showPackResult(card,dup);playSfx(dup?'coin':'unlock')}
function saveNick(){const val=($('#nickInput')?.value||'').trim().replace(/\s+/g,' ');if(!val){toast('Digite um nick antes de salvar.');return}save.nick=val.slice(0,18);persist();hideModal();setScreen(nickReturnScreen||'profile');toast('Nick atualizado!');playSfx('click')}
function resetSave(){showModal(`<div class="modal-head"><div><div class="eyebrow">Atenção</div><h2>Reiniciar progresso?</h2></div><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div><p class="muted small">Isso apaga seu nick salvo, moedas, nível, partidas e figurinhas deste navegador. Essa ação não pode ser desfeita.</p><div class="btn-row"><button class="btn danger block" data-action="confirmReset">Reiniciar tudo</button><button class="btn outline" data-action="closeModal">Cancelar</button></div>`)}
function rarityRewardCard(){const pool=cardDefs.filter(c=>!save.owned.includes(c.id));if(!pool.length)return null;const r=Math.random();let rarity=r<.48?'common':r<.75?'uncommon':r<.9?'rare':r<.985?'epic':'legendary';let a=pool.filter(c=>c.rarity===rarity);if(!a.length)a=pool;return a[Math.floor(Math.random()*a.length)]}
function unlockCard(id){if(save.owned.includes(id))return null;const c=cardDefs.find(x=>x.id===id);if(c){save.owned.push(id);return c}return null}
function playSfx(type='click'){if(!save.settings.sfx||save.settings.volume<=0)return;try{ensureAudio();const ctx=audio.ctx;if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type==='unlock'?'triangle':'sine';const freqs={click:420,coin:850,unlock:660,good:570,bad:170,win:760};osc.frequency.setValueAtTime(freqs[type]||420,ctx.currentTime);if(type==='unlock'||type==='win')osc.frequency.exponentialRampToValueAtTime((freqs[type]||760)*1.55,ctx.currentTime+.13);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(Math.max(.005,save.settings.volume*.16),ctx.currentTime+.012);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.18);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.19)}catch(e){}}
const audio={ctx:null,interval:null,idx:0,started:false};function ensureAudio(){if(!audio.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)audio.ctx=new C()}if(audio.ctx?.state==='suspended')audio.ctx.resume();if(!audio.started){audio.started=true;syncMusic()}}
function musicNote(freq,dur=.2){if(!audio.ctx||!save.settings.music||save.settings.volume<=0)return;try{const t=audio.ctx.currentTime;const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.004,save.settings.volume*.045),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.ctx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function syncMusic(){clearInterval(audio.interval);audio.interval=null;if(save.settings.music&&audio.ctx){const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,261.63,329.63,392,493.88,440,392,329.63,293.66];audio.interval=setInterval(()=>{const n=notes[audio.idx++%notes.length];musicNote(n,.17);if(audio.idx%4===0)musicNote(n/2,.22)},310)}}
function toggleSetting(key){save.settings[key]=!save.settings[key];persist();if(key==='music'){ensureAudio();syncMusic()}playSfx('click');setScreen(currentScreen)}
function toggleMusicQuick(){save.settings.music=!save.settings.music;ensureAudio();persist();syncMusic();$('#musicQuick').innerHTML=icon(save.settings.music?'music':'mute');$('#musicQuick').classList.toggle('active',save.settings.music);toast(save.settings.music?'Música ligada':'Música desligada');playSfx('click')}
function initQuickMusic(){const b=$('#musicQuick');b.innerHTML=icon(save.settings.music?'music':'mute');b.classList.toggle('active',save.settings.music);const s=$('#settingsQuick');if(s)s.innerHTML=icon('settings')}
function setVolume(v){save.settings.volume=Math.max(0,Math.min(1,v));persist();const lab=$('#volumeLabel');if(lab)lab.textContent=Math.round(save.settings.volume*100)+'%'}
function completeGame(id,win,score){if(!gameState||gameState.done)return;gameState.done=true;stopGameLoop();const g=games.find(x=>x.id===id);const newBest=Math.max(save.scores[id]||0,score||0);save.scores[id]=newBest;save.played++;if(win)save.wins++;let coins=win?30+Math.min(25,Math.round((score||0)*2)):Math.max(5,Math.round((score||0)*1.5));let xp=win?45+Math.min(20,Math.round((score||0)*2)):15;const p=applyProgress(xp,coins);let extra=null;if(win){if(id==='opala'&&!save.owned.includes('opalão'))extra=cardDefs.find(c=>c.id==='opalão');else if(save.wins%3===0)extra=rarityRewardCard();if(extra&&!save.owned.includes(extra.id))save.owned.push(extra.id);else extra=null;}
 if(currentScreen==='game'){}persist();if(activeStage!==null&&activeStage!==undefined&&win){save.adventure=Math.max(save.adventure,activeStage+1);activeStage=null;persist()}showResult(win,score,coins,xp,p.unlocked,extra,id);playSfx(win?'win':'bad')}
let activeStage=null;

function updateGame(dt){const s=gameState,w=canvasW,h=canvasH;if(s.id==='runner'){s.time-=dt;const ground=h-58;const scale=Math.min(w/520,h/390,1.2);if(controlHeld.left)s.playerX=Math.max(.05,s.playerX-dt*.65);if(controlHeld.right)s.playerX=Math.min(.75,s.playerX+dt*.65);if(!s.onGround){s.vy+=1150*scale*dt;s.playerY+=s.vy*dt;if(s.playerY>=0){s.playerY=0;s.vy=0;s.onGround=true}}s.spawn-=dt;if(s.spawn<=0){s.spawn=.75+Math.random()*.7;const coin=Math.random()<.66;s.objects.push({x:w+35,y:coin?ground-55-Math.random()*100:ground-30,w:coin?22:35,h:coin?22:32,type:coin?'coin':'obstacle',passed:false})}for(const o of s.objects)o.x-=(o.type==='coin'?w*.54:w*.67)*dt;s.objects=s.objects.filter(o=>o.x+o.w>-20);const px=s.playerX*w,py=ground-98*scale+s.playerY,pw=58*scale,ph=96*scale;for(const o of s.objects){if(o.passed)continue;if(px+pw*.7>o.x&&px+pw*.2<o.x+o.w&&py+ph*.55>o.y-o.h*.45&&py<o.y+o.h){o.passed=true;if(o.type==='coin'){s.score+=1;playSfx('coin')}else{s.time=Math.max(0,s.time-2);playSfx('bad')}}}if(s.time<=0)completeGame('runner',s.score>=4,s.score)}

function drawBg(c,w,h,kind){const grad=c.createLinearGradient(0,0,0,h);if(kind==='runner'){grad.addColorStop(0,'#5e8d9a');grad.addColorStop(.56,'#e5c59c');grad.addColorStop(.57,'#9d754b');grad.addColorStop(1,'#684a35')}else if(kind==='cuscuz'){grad.addColorStop(0,'#719d78');grad.addColorStop(.68,'#d6d49c');grad.addColorStop(.69,'#7d5f42');grad.addColorStop(1,'#3d302e')}else if(kind==='respira'){grad.addColorStop(0,'#273d63');grad.addColorStop(1,'#141927')}else{grad.addColorStop(0,'#343341');grad.addColorStop(1,'#171720')}c.fillStyle=grad;c.fillRect(0,0,w,h);if(kind==='runner'||kind==='cuscuz'){c.fillStyle=kind==='runner'?'#8c9e72':'#a8b57d';for(let i=0;i<7;i++){const x=(i*139+23)%w;const y=h*.47+(i%3)*10;c.beginPath();c.ellipse(x,y,85,23,0,0,Math.PI*2);c.fill()}c.strokeStyle='#fff2';c.lineWidth=2;for(let i=0;i<10;i++){const x=(i*101+((performance.now()/35)%100))%w;c.beginPath();c.moveTo(x,h*.6);c.lineTo(x+24,h*.6-7);c.stroke()}}}
function drawGame(){if(!ctx||!gameState)return;const c=ctx,w=canvasW,h=canvasH,s=gameState;c.clearRect(0,0,w,h);drawBg(c,w,h,s.id);if(s.id==='runner'){const ground=h-58,scale=Math.min(w/520,h/390,1.2);c.fillStyle='#594332';c.fillRect(0,ground,w,h-ground);c.fillStyle='#d5b88c';c.fillRect(0,ground,w,5);for(let i=0;i<9;i++){const x=(i*105-(s.elapsed*130)%105);c.fillStyle='#a48663';c.fillRect(x,ground+30,35,3)}for(const o of s.objects){if(o.type==='coin'){c.beginPath();c.arc(o.x,o.y,11,0,Math.PI*2);c.fillStyle='#f2c950';c.fill();c.strokeStyle='#fff0a0';c.lineWidth=3;c.stroke();c.fillStyle='#94691d';c.font='bold 13px sans-serif';c.textAlign='center';c.fillText('C',o.x,o.y+5)}else{roundRect(c,o.x,o.y-15,o.w,o.h,6,'#873f4a','#e58f85');c.fillStyle='#cc6f68';c.fillRect(o.x+7,o.y-8,7,7)}}const px=s.playerX*w,py=ground-99*scale+s.playerY;drawCharacter(c,px,py,60*scale,98*scale,s.onGround?'correndo':'susto');c.fillStyle='#ffffffde';c.font='800 13px system-ui';c.textAlign='left';c.fillText('MOEDAS '+s.score,14,24);c.fillStyle='#fff';c.font='11px system-ui';c.fillText('Pule e desvie',14,42)}

else if(s.id==='respira'){const cx=w/2,cy=h*.42,r=Math.min(w,h)*.24;c.beginPath();c.arc(cx,cy,r+16,0,Math.PI*2);c.fillStyle='#ffffff0a';c.fill();c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.lineWidth=14;c.strokeStyle='#4b4659';c.stroke();c.beginPath();c.arc(cx,cy,r,-Math.PI*.8,-Math.PI*.8+Math.PI*1.6*s.pointer);c.strokeStyle='#f3c65c';c.lineWidth=14;c.lineCap='round';c.stroke();c.beginPath();c.arc(cx,cy,13,0,Math.PI*2);c.fillStyle='#f3c65c';c.fill();drawCharacter(c,cx-r*.65,cy+r*.25,r*1.3,r*1.55,s.hits>=4?'debochado':'bravo');roundRect(c,cx-w*.22,h-42,w*.44,18,9,'#ffffff18');roundRect(c,cx-w*.22,h-42,w*.44*Math.max(0,s.time/Math.max(.01,8/Math.max(1,8-s.round))),18,9,'#7acfa4');c.fillStyle='#fff';c.font='900 14px system-ui';c.textAlign='center';c.fillText('TENTATIVA '+Math.min(8,s.round+1)+'/8',cx,25);c.font='12px system-ui';c.fillStyle='#d0cede';c.fillText('Faixa dourada = momento certo',cx,47)}

function drawMiniCar(c,x,y,w,h,color,gold=false){roundRect(c,x,y,w,h,Math.min(6,w*.15),color,gold?'#ffe5a0':'#bdc8e3');roundRect(c,x+w*.22,y+h*.14,w*.56,h*.24,3,'#1c2430');roundRect(c,x+w*.22,y+h*.54,w*.56,h*.23,3,'#242833');c.fillStyle='#101015';c.fillRect(x-2,y+h*.2,4,h*.2);c.fillRect(x-2,y+h*.61,4,h*.2);c.fillRect(x+w-2,y+h*.2,4,h*.2);c.fillRect(x+w-2,y+h*.61,4,h*.2);if(gold){c.fillStyle='#332820';c.font=`900 ${Math.max(7,w*.18)}px sans-serif`;c.textAlign='center';c.fillText('OP',x+w/2,y+h*.49)}}
function updateHUD(){if(!gameState)return;const t=$('#hudTime'),sc=$('#hudScore');if(t)t.textContent=gameState.id==='opala'?'Movimentos: '+gameState.moves:gameState.id==='respira'?'Tentativas: '+gameState.round+'/8':Math.max(0,Math.ceil(gameState.time))+'s';if(sc)sc.textContent=gameState.id==='cuscuz'?gameState.good:gameState.id==='respira'?gameState.hits:gameState.score}

function gameAction(action){if(!gameState||gameState.done||gameState.paused)return;if(gameState.id==='runner'){if(action==='jump'||action==='tap')jump()}else if(gameState.id==='respira'&&action==='tap'){if(gameState.round>=8)return;const success=gameState.pointer>.39&&gameState.pointer<.62;gameState.round++;if(success){gameState.hits++;gameState.score=gameState.hits;playSfx('good');toast('Boa! Brutinho respirou.')}else{playSfx('bad');toast('Quase! Espere o ponteiro chegar ao centro.')}if(gameState.round>=8)completeGame('respira',gameState.hits>=5,gameState.hits);else gameState.time=2.6}else if(gameState.id==='opala'){if(!['up','down','left','right'].includes(action))return;const dx=action==='left'?-1:action==='right'?1:0,dy=action==='up'?-1:action==='down'?1:0;const nx=gameState.car.x+dx,ny=gameState.car.y+dy;if(nx<0||nx>7||ny<0||ny>5)return;if(gameState.blocks.some(b=>b[0]===nx&&b[1]===ny)){playSfx('bad');toast('Tem um carro nessa vaga!');return}gameState.car={x:nx,y:ny};gameState.moves++;gameState.score=Math.max(0,30-gameState.moves);playSfx('click');if(nx===7&&ny===3)completeGame('opala',true,Math.max(0,30-gameState.moves));else{drawGame();updateHUD()}}}

function handleAction(el){const a=el.dataset.action;if(a==='editNick'){showNickModal();return}if(a==='saveNick'){saveNick();return}if(a==='closeModal'){hideModal();return}if(a==='closeThenAlbum'){hideModal();setScreen('album');return}if(a==='openPack'){openPack();return}if(a==='equipCard'){const id=el.dataset.id;if(save.owned.includes(id)&&cardDefs.find(c=>c.id===id)?.kind==='char'){save.avatar=id;persist();hideModal();setScreen('profile');toast('Figurinha equipada como avatar!')}return}if(a==='resetSave'){resetSave();return}if(a==='confirmReset'){save=defaultSave();persist();hideModal();setScreen('menu');toast('Progresso reiniciado.');return}if(a==='toggleMusic'){toggleMusicQuick();return}if(a==='pauseGame'){showPause();return}if(a==='resumeGame'){hideModal();if(gameState){gameState.paused=false;gameState.last=performance.now();const b=$('#pauseGame');if(b)b.innerHTML=icon('pause');gameRAF=requestAnimationFrame(gameFrame)}return}if(a==='restartGame'){const id=el.dataset.id||activeGame;hideModal();startGame(id,activeStage);return}if(a==='leaveGame'){hideModal();leaveGame();return}if(a==='replayGame'){const id=el.dataset.id;hideModal();startGame(id,activeStage);return}}
$('#musicQuick').addEventListener('click',toggleMusicQuick);$('#settingsQuick').addEventListener('click',()=>setScreen('settings'));
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');const action=e.target.closest('[data-action]');const game=e.target.closest('[data-game]');const card=e.target.closest('[data-card]');const avatar=e.target.closest('[data-avatar]');const tog=e.target.closest('[data-toggle]');const control=e.target.closest('[data-control]');if(action){e.preventDefault();handleAction(action);if(action.dataset.action!=='saveNick'&&action.dataset.action!=='editNick'&&action.dataset.action!=='openPack')playSfx('click');return}if(nav){e.preventDefault();if(nav.dataset.nav==='store'||nav.dataset.nav==='settings'||nav.dataset.nav==='about'||nav.dataset.nav==='updates')setScreen(nav.dataset.nav);else setScreen(nav.dataset.nav);hideModal();playSfx('click');return}if(game){e.preventDefault();ensureAudio();startGame(game.dataset.game,game.dataset.stage??null);return}if(card){e.preventDefault();showCardModal(card.dataset.card);playSfx('click');return}if(avatar){e.preventDefault();const id=avatar.dataset.avatar;if(save.owned.includes(id)){save.avatar=id;persist();setScreen('profile');toast('Avatar atualizado!');playSfx('unlock')}return}if(tog){toggleSetting(tog.dataset.toggle);return}if(control){return}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-control]'))return;}, {passive:true});
document.addEventListener('click',e=>{if(e.target.matches('[data-dismiss-modal]')){if(gameState&&gameState.paused){hideModal();gameState.paused=false;gameState.last=performance.now();gameRAF=requestAnimationFrame(gameFrame)}else hideModal()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-volume]'))setVolume(Number(e.target.value)/100)});document.addEventListener('input',e=>{if(e.target.matches('[data-volume]')){$('#volumeLabel').textContent=e.target.value+'%'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='nickInput'){e.preventDefault();saveNick();return}if(e.key==='Escape'&&currentScreen==='game'&&gameState){showPause();return}if(currentScreen!=='game'||!gameState)return;const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' ','w','a','s','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a'){if(gameState.id==='opala')gameAction('left');else controlHeld.left=true}if(k==='arrowright'||k==='d'){if(gameState.id==='opala')gameAction('right');else controlHeld.right=true}if(k==='arrowup'||k==='w')gameAction(gameState.id==='runner'?'jump':gameState.id==='respira'?'tap':'up');if(k==='arrowdown'||k==='s'){if(gameState.id==='opala')gameAction('down')}if(k===' '){gameAction(gameState.id==='runner'?'jump':gameState.id==='respira'?'tap':'up')}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')controlHeld.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')controlHeld.right=false});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input')&&currentScreen==='game'&&gameState?.id==='runner')jump()});
function startAdventure(){const idx=Math.min(save.adventure,5);const stages=['runner','cuscuz','respira','opala','runner','respira'];startGame(stages[idx],idx)}
document.addEventListener('click',e=>{const p=e.target.closest('[data-action="playAdventure"]');if(p){ensureAudio();startAdventure()}});
window.addEventListener('blur',()=>{controlHeld.left=false;controlHeld.right=false});
function begin(){const isNew=!readStored();const loading=$('#loading'),app=$('#app'),fill=$('#loadFill'),percent=$('#loadPercent'),status=$('#loadStatus');const imgs=Object.values(ASSETS);let done=0;const total=imgs.length;const tick=()=>{done++;const pct=Math.min(95,Math.round(done/total*95));fill.style.width=pct+'%';percent.textContent=pct+'%';status.textContent=done===total?'Quase pronto...':'Carregando recursos'};Promise.all(imgs.map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>{tick();resolve()};im.onerror=()=>{tick();resolve()};im.src=src}))).then(()=>{fill.style.width='100%';percent.textContent='100%';status.textContent='Tudo pronto';setTimeout(()=>{loading.classList.add('fade');setTimeout(()=>loading.remove(),380);app.classList.remove('hidden');persist();initQuickMusic();setScreen('menu');if(isNew)showNickModal()},350)})}
// Monitoramento anônimo do jogo. Não coleta nome, e-mail, IP ou conteúdo do perfil.
const GameTelemetry = (() => {
  const API = '/api/event';
  let visitorId = '';
  try {
    visitorId = localStorage.getItem('acalmeTelemetryVisitor') || '';
    if (!visitorId) { visitorId = (crypto.randomUUID ? crypto.randomUUID() : 'v-'+Math.random().toString(36).slice(2)+Date.now()); localStorage.setItem('acalmeTelemetryVisitor', visitorId); }
  } catch (_) { visitorId = 'session-'+Math.random().toString(36).slice(2); }
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : 's-'+Math.random().toString(36).slice(2)+Date.now());
  let gameStartedAt = 0, gameId = null, lastScreen = 'menu', lastHeartbeat = 0;
  function send(event, data = {}, keepalive = false) {
    const payload = {event, visitor_id: visitorId, session_id: sessionId, data: data || {}, ts: new Date().toISOString()};
    try { fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive}).catch(()=>{}); } catch (_) {}
  }
  function finishGame(reason='left') {
    if (!gameStartedAt || !gameId) return;
    const seconds = Math.max(0, Math.min(86400, Math.round((Date.now()-gameStartedAt)/1000)));
    send('game_session_end', {game_id:gameId, duration_seconds:seconds, reason}, true);
    gameStartedAt = 0; gameId = null;
  }
  function startGame(id, stage) {
    finishGame('switched_game'); gameId = String(id || 'unknown').slice(0,60); gameStartedAt = Date.now();
    send('game_start', {game_id:gameId, stage: Number.isFinite(Number(stage)) ? Number(stage) : null});
  }
  function screen(name) { const n=String(name || 'unknown').slice(0,60); if (n!==lastScreen) { send('screen_view', {screen:n}); lastScreen=n; } }
  send('page_view', {path: location.pathname, referrer: safeReferrer()});
  function safeReferrer() { try { const u = new URL(document.referrer); return u.origin; } catch (_) { return ''; } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { send('session_pause', {screen:lastScreen}, true); if (gameStartedAt) send('game_heartbeat', {game_id:gameId, duration_seconds:Math.round((Date.now()-gameStartedAt)/1000)}, true); } });
  window.addEventListener('pagehide', () => { finishGame('page_closed'); send('session_end', {screen:lastScreen}, true); });
  return {send, screen, startGame, finishGame};
})();
// The browser's local Web Audio starts only after the player's first interaction.
begin();
